<!DOCTYPE html>
<html lang="en">
      <head>
            <title>Colors</title>
            <meta charset="UTF-8">
            <style>
                .box1 {
                    width: 300px;
                    height: 300px;
                    display: inline-block;
                    margin: 5px;
                    background-color: rgb(223, 83, 83);
                    border: 20px solid rgb(51, 104, 75);
                    border-radius: 20px;
                    color: rgb(255, 255, 255);
                }
                .box2 {
                    width: 300px;
                    height: 300px;
                    display: inline-block;
                    margin: 5px;
                    background-color: rgb(158, 113, 29);
                    border: 20px solid rgb(175, 17, 17);
                    border-radius: 20px;
                    color: yellow;
                }
                .box3 {
                    width: 300px;
                    height: 300px;
                    display: inline-block;
                    margin: 5px;
                    background-color: blue;
                    border: 20px solid rgb(198, 201, 62);
                    border-radius: 20px;
                    color:rgb(156, 40, 40)
                }
            </style>
      </head>
      <body>
            <h1>Colors</h1>
            <div class="box1">
                <p>Complementary Colors</p>
            </div>
            <div class="box2">
                <p>Analogous Colors</p>
            </div>
            <div class="box3">
                <p>Triadic Colors</p>
            </div>
      </body>
</html>
